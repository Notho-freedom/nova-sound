<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voyage Galactique</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            overflow-x: hidden;
            color: #fff;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
            max-width: 900px;
            margin: 0 auto;
            padding: 150px 60px 200px;
        }

        .reading-panel {
            background: rgba(0, 5, 20, 0.9);
            backdrop-filter: blur(40px) saturate(180%);
            border: 2px solid transparent;
            border-radius: 30px;
            padding: 80px;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 0 120px rgba(100, 50, 255, 0.4),
                0 0 200px rgba(255, 100, 50, 0.3),
                inset 0 0 100px rgba(50, 100, 255, 0.1);
        }

        .reading-panel::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                #ff6b35, #f7931e, #ffd700, #4ecdc4, #6c5ce7, #a29bfe, #ff6b35);
            background-size: 400% 400%;
            border-radius: 30px;
            z-index: -1;
            animation: galaxyBorder 15s ease infinite;
        }

        @keyframes galaxyBorder {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        h1 {
            font-size: 4em;
            font-weight: 900;
            margin-bottom: 40px;
            background: linear-gradient(135deg, 
                #ff6b35 0%, 
                #ffd700 25%, 
                #4ecdc4 50%, 
                #6c5ce7 75%, 
                #ff6b35 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleGalaxy 8s ease infinite;
            filter: drop-shadow(0 0 30px rgba(255, 107, 53, 0.8));
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        @keyframes titleGalaxy {
            0%, 100% { 
                background-position: 0% 50%;
                filter: drop-shadow(0 0 30px rgba(255, 107, 53, 0.8));
            }
            50% { 
                background-position: 100% 50%;
                filter: drop-shadow(0 0 40px rgba(108, 92, 231, 0.8));
            }
        }

        .chapter {
            margin-bottom: 60px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInChapter 1.2s forwards;
        }

        .chapter:nth-child(2) { animation-delay: 0.3s; }
        .chapter:nth-child(3) { animation-delay: 0.6s; }
        .chapter:nth-child(4) { animation-delay: 0.9s; }
        .chapter:nth-child(5) { animation-delay: 1.2s; }

        @keyframes fadeInChapter {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            font-size: 2em;
            color: #ffd700;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            letter-spacing: 3px;
        }

        p {
            font-size: 1.15em;
            line-height: 2;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 0 10px rgba(78, 205, 196, 0.3);
            margin-bottom: 20px;
            font-weight: 300;
        }

        .highlight {
            color: #4ecdc4;
            font-weight: 500;
            text-shadow: 0 0 15px rgba(78, 205, 196, 0.8);
        }

        .nav-info {
            position: fixed;
            top: 40px;
            right: 40px;
            z-index: 20;
            text-align: right;
            opacity: 0.8;
        }

        .nav-info div {
            font-size: 1.2em;
            color: #4ecdc4;
            text-shadow: 0 0 10px rgba(78, 205, 196, 1);
            margin-bottom: 5px;
        }

        .system-name {
            font-size: 2em;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 1);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="nav-info">
        <div class="system-name" id="systemName">SYSTÈME SOLAIRE</div>
        <div id="planetInfo">En approche...</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let sun, planets = [], moons = [];
        let stars, galaxy;
        let time = 0;

        const planetData = [
            { name: "Mercure", size: 0.4, distance: 8, speed: 0.02, color: 0x8c7853, rings: false },
            { name: "Vénus", size: 0.9, distance: 12, speed: 0.015, color: 0xffc649, rings: false },
            { name: "Terre", size: 1, distance: 16, speed: 0.01, color: 0x2f6a9f, rings: false, hasMoon: true },
            { name: "Mars", size: 0.5, distance: 20, speed: 0.008, color: 0xcd5c5c, rings: false },
            { name: "Jupiter", size: 3, distance: 30, speed: 0.005, color: 0xdaa520, rings: false },
            { name: "Saturne", size: 2.5, distance: 40, speed: 0.004, color: 0xf4a460, rings: true },
            { name: "Uranus", size: 1.5, distance: 50, speed: 0.003, color: 0x4fd5d6, rings: true },
            { name: "Neptune", size: 1.4, distance: 60, speed: 0.002, color: 0x4169e1, rings: false }
        ];

        function init() {
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
            camera.position.set(0, 80, 100);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('canvas'),
                antialias: true,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            createStarField();
            createGalaxyBackground();
            createSun();
            createPlanets();
            addLighting();

            window.addEventListener('resize', onResize);
            window.addEventListener('scroll', onScroll);
        }

        function createStarField() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            const colors = [];

            for (let i = 0; i < 15000; i++) {
                const x = (Math.random() - 0.5) * 4000;
                const y = (Math.random() - 0.5) * 4000;
                const z = (Math.random() - 0.5) * 4000;
                vertices.push(x, y, z);

                const color = new THREE.Color();
                const hue = Math.random() * 0.1 + 0.55;
                color.setHSL(hue, 0.3, 0.8 + Math.random() * 0.2);
                colors.push(color.r, color.g, color.b);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 1.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.8
            });

            stars = new THREE.Points(geometry, material);
            scene.add(stars);
        }

        function createGalaxyBackground() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            const colors = [];

            for (let i = 0; i < 50000; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 2000 + 500;
                const height = (Math.random() - 0.5) * 200;

                const x = Math.cos(angle) * radius;
                const y = height;
                const z = Math.sin(angle) * radius;

                vertices.push(x, y, z);

                const color = new THREE.Color();
                const distanceFromCenter = Math.sqrt(x * x + z * z);
                const hue = 0.6 - (distanceFromCenter / 2500) * 0.3;
                color.setHSL(hue, 0.8, 0.6);
                colors.push(color.r, color.g, color.b);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 2,
                vertexColors: true,
                transparent: true,
                opacity: 0.3,
                blending: THREE.AdditiveBlending
            });

            galaxy = new THREE.Points(geometry, material);
            scene.add(galaxy);
        }

        function createSun() {
            const geometry = new THREE.SphereGeometry(5, 32, 32);
            const material = new THREE.MeshBasicMaterial({
                color: 0xfdb813,
                emissive: 0xfdb813,
                emissiveIntensity: 1
            });
            
            sun = new THREE.Mesh(geometry, material);
            scene.add(sun);

            const glowGeometry = new THREE.SphereGeometry(7, 32, 32);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: 0xffaa00,
                transparent: true,
                opacity: 0.3,
                blending: THREE.AdditiveBlending
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            sun.add(glow);
        }

        function createPlanets() {
            planetData.forEach((data, index) => {
                const geometry = new THREE.SphereGeometry(data.size, 32, 32);
                const material = new THREE.MeshPhongMaterial({
                    color: data.color,
                    shininess: 30,
                    emissive: data.color,
                    emissiveIntensity: 0.1
                });
                
                const planet = new THREE.Mesh(geometry, material);
                planet.userData = {
                    distance: data.distance,
                    speed: data.speed,
                    angle: Math.random() * Math.PI * 2,
                    name: data.name
                };
                
                scene.add(planet);
                planets.push(planet);

                if (data.rings) {
                    const ringGeometry = new THREE.RingGeometry(data.size * 1.5, data.size * 2.5, 64);
                    const ringMaterial = new THREE.MeshBasicMaterial({
                        color: data.color,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.6
                    });
                    const ring = new THREE.Mesh(ringGeometry, ringMaterial);
                    ring.rotation.x = Math.PI / 2;
                    planet.add(ring);
                }

                if (data.hasMoon) {
                    const moonGeometry = new THREE.SphereGeometry(0.3, 16, 16);
                    const moonMaterial = new THREE.MeshPhongMaterial({
                        color: 0xaaaaaa,
                        shininess: 10
                    });
                    const moon = new THREE.Mesh(moonGeometry, moonMaterial);
                    moon.userData = {
                        planet: planet,
                        distance: 3,
                        speed: 0.05,
                        angle: 0
                    };
                    scene.add(moon);
                    moons.push(moon);
                }

                const orbitGeometry = new THREE.BufferGeometry();
                const orbitPoints = [];
                for (let i = 0; i <= 64; i++) {
                    const angle = (i / 64) * Math.PI * 2;
                    orbitPoints.push(
                        Math.cos(angle) * data.distance,
                        0,
                        Math.sin(angle) * data.distance
                    );
                }
                orbitGeometry.setAttribute('position', new THREE.Float32BufferAttribute(orbitPoints, 3));
                const orbitMaterial = new THREE.LineBasicMaterial({
                    color: 0x444444,
                    transparent: true,
                    opacity: 0.3
                });
                const orbit = new THREE.Line(orbitGeometry, orbitMaterial);
                scene.add(orbit);
            });
        }

        function addLighting() {
            const ambientLight = new THREE.AmbientLight(0x222222);
            scene.add(ambientLight);

            const sunLight = new THREE.PointLight(0xffffff, 2, 300);
            sunLight.position.set(0, 0, 0);
            scene.add(sunLight);
        }

        function onScroll() {
            const scrollPercent = window.scrollY / (document.body.scrollHeight - window.innerHeight);
            const cameraDistance = 100 + scrollPercent * 200;
            const cameraHeight = 80 - scrollPercent * 50;
            
            camera.position.z = cameraDistance * Math.cos(scrollPercent * Math.PI);
            camera.position.x = cameraDistance * Math.sin(scrollPercent * Math.PI);
            camera.position.y = cameraHeight;
            camera.lookAt(0, 0, 0);
        }

        function animate() {
            requestAnimationFrame(animate);
            time += 0.005;

            sun.rotation.y += 0.002;

            planets.forEach(planet => {
                planet.userData.angle += planet.userData.speed;
                planet.position.x = Math.cos(planet.userData.angle) * planet.userData.distance;
                planet.position.z = Math.sin(planet.userData.angle) * planet.userData.distance;
                planet.rotation.y += 0.01;

                const distanceToCamera = camera.position.distanceTo(planet.position);
                if (distanceToCamera < 30) {
                    document.getElementById('planetInfo').textContent = planet.userData.name;
                }
            });

            moons.forEach(moon => {
                moon.userData.angle += moon.userData.speed;
                const planet = moon.userData.planet;
                moon.position.x = planet.position.x + Math.cos(moon.userData.angle) * moon.userData.distance;
                moon.position.z = planet.position.z + Math.sin(moon.userData.angle) * moon.userData.distance;
                moon.position.y = planet.position.y + Math.sin(moon.userData.angle * 2) * 0.5;
            });

            stars.rotation.y += 0.0001;
            galaxy.rotation.y += 0.00005;

            renderer.render(scene, camera);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
        animate();
    </script>
</body>
</html>
